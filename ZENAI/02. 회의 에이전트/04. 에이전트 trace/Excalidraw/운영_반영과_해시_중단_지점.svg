<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="30" text-anchor="middle"><tspan x="585" y="50">운영 반영: 실제 중단 위치</tspan></text><rect x="35" y="110" width="300" height="100" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="185" y="148">① 로컬 호환 이미지</tspan><tspan x="185" y="174">실제 API · 브라우저 검증</tspan></text><rect x="425" y="110" width="300" height="100" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="575" y="148">② 운영 읽기 / Secrets 준비</tspan><tspan x="575" y="174">GitHub Actions → AWS SSM</tspan></text><rect x="815" y="110" width="320" height="100" rx="12" fill="#fee2e2" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="975" y="148">③ URL 적용 준비 검사</tspan><tspan x="975" y="174">구성 해시 불일치 → 중단</tspan></text><rect x="815" y="330" width="320" height="100" rx="12" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="975" y="368">④ URL 적용 · 재생성</tspan><tspan x="975" y="394">마지막 실패 실행은 미도달</tspan></text><rect x="425" y="330" width="300" height="100" rx="12" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="575" y="368">⑤ 패치 이미지 · 경로 전환</tspan><tspan x="575" y="394">운영 성공 확인 없음</tspan></text><rect x="35" y="330" width="300" height="100" rx="12" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="middle"><tspan x="185" y="368">⑥ 운영 모델 호출 · 표시</tspan><tspan x="185" y="394">최종 완료 판정 불가</tspan></text><path d="M335 160 L420 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M725 160 L810 160" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M975 210 L975 325" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M815 380 L730 380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M425 380 L340 380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="19" text-anchor="middle"><tspan x="590" y="514">해시 충돌 ×    구성 해시 불일치 ○</tspan></text><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="19" text-anchor="middle"><tspan x="590" y="559">달러 기호 비교 오탐은 수정 → 비교 항목 same / entrypoint unknown → 전체 해시는 여전히 불일치</tspan></text><text fill="#1e293b" font-family="Malgun Gothic, sans-serif" font-size="19" text-anchor="middle"><tspan x="590" y="609">회색 단계는 예정 절차다. 화살표가 실제 실행 완료를 의미하지 않는다.</tspan></text></svg>
