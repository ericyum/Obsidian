<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1190" viewBox="0 0 1380 1190"><title>스킬을 사용한다는 뜻 | 지침을 읽고 같은 Agent가 일을 계속한다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#293a50"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Malgun Gothic,sans-serif" font-size="30" fill="#293a50"><tspan x="40" y="50">스킬을 사용한다는 뜻 | 지침을 읽고 같은 Agent가 일을 계속한다</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="40" y="89">일반 동작 원리 + ZEN AI 적용 예시 · 모델 학습이나 별도 Agent 생성이 아님</tspan></text><rect x="40" y="120" width="620" height="110" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="156">0  관리자가 스킬을 체크해 연결</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="190">사용 가능 범위 설정: 회의 결론 정리 v1, 표 작성 v2</tspan><tspan x="58" y="216.6">체크 ≠ 지금 실행 / 파일 복사도 필요 없음</tspan></text><rect x="720" y="120" width="620" height="110" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="156">1  호스트가 허용 목록 제공</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="190">모델 입력: 요청 + 이름/설명 + 읽는 방법</tspan><tspan x="738" y="216.6">권한·버전·파일 경로는 서버가 관리</tspan></text><path d="M664 175 L715 175" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="280" width="620" height="110" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="316">2  모델이 관련 스킬 선택</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="350">‘회의 결론과 후속 조치를 정리해줘’</tspan><tspan x="738" y="376.6">→ 회의 결론 정리 선택 / 표 작성은 불필요하면 생략</tspan></text><path d="M1040 234 L1040 275" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="280" width="620" height="110" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="316">3  호스트가 본문 읽기 요청 처리</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="350">read_skill(등록 ID) 또는 제한된 파일 읽기 예시</tspan><tspan x="58" y="376.6">권한·버전 검증 후 SKILL.md 반환</tspan></text><path d="M715 335 L665 335" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="440" width="620" height="145" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="476">4  본문이 모델 문맥에 추가됨</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="510">기존 대화 + ‘결정/미결/담당·기한을 구분하라’</tspan><tspan x="58" y="536.6">모델의 다음 판단이 구체적인 절차를 참고</tspan><tspan x="58" y="563.2">필요하면 참조 문서만 추가로 읽음</tspan></text><path d="M350 394 L350 435" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="440" width="620" height="145" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="476">5  모델이 실제 업무 Tool 호출</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="510">예: 허용된 회의록 조회 → 결과 확인</tspan><tspan x="738" y="536.6">권한·HITL·백그라운드는 Tool 실행 계약으로 처리</tspan><tspan x="738" y="563.2">스킬 파일 자체가 작업을 실행하지 않음</tspan></text><path d="M664 500 L715 500" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="620" width="620" height="110" rx="12" fill="#e7f6ef" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="656">6  근거를 확인하고 결과 작성</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="690">결정 / 미결 / 담당 / 기한 / 근거로 정리</tspan><tspan x="738" y="716.6">자료에 없는 담당·기한은 ‘미정’으로 표시</tspan></text><path d="M1040 564 L1040 615" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="620" width="620" height="110" rx="12" fill="#fff4dd" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="656">읽지 않았다면 적용됐다고 단정하지 않기</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="690">선택·본문 로딩·Tool 호출·결과를 각각 확인</tspan><tspan x="58" y="716.6">추론 원문을 수집할 필요는 없음</tspan></text><rect x="40" y="790" width="1300" height="330" rx="12" fill="#fafafa" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="26" fill="#293a50"><tspan x="60" y="836">점진적 로딩: 저장량과 모델 입력량은 다릅니다</tspan></text><rect x="70" y="865" width="385" height="165" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="88" y="901">먼저  목록</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="88" y="935">이름·설명 중심</tspan><tspan x="88" y="961.6">많아지면 목록도 비용 발생</tspan><tspan x="88" y="988.2">관련 없는 항목은 제외</tspan></text><rect x="495" y="865" width="385" height="165" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="513" y="901">필요할 때  본문</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="513" y="935">선택된 SKILL.md 읽기</tspan><tspan x="513" y="961.6">절차·기준·출력 형식</tspan><tspan x="513" y="988.2">중복 로딩은 피함</tspan></text><rect x="920" y="865" width="385" height="165" rx="12" fill="#e7f6ef" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="938" y="901">필요한 부분만  자료</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="938" y="935">references / assets</tspan><tspan x="938" y="961.6">선택적 scripts 실행</tspan><tspan x="938" y="988.2">파일·실행 권한 별도 검사</tspan></text><path d="M460 946 L490 946" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><path d="M885 946 L915 946" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="65" y="1079">명시적으로 스킬을 지정하면 호스트가 본문을 바로 제공할 수도 있습니다. 구현 방식은 제품별로 다릅니다.</tspan></text></svg>
