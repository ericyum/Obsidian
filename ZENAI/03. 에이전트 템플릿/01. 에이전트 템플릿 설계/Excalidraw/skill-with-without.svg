<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="890" viewBox="0 0 1380 890"><title>스킬이 없을 때와 있을 때 | 같은 모델·같은 Tool·같은 자료</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#293a50"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Malgun Gothic,sans-serif" font-size="30" fill="#293a50"><tspan x="40" y="50">스킬이 없을 때와 있을 때 | 같은 모델·같은 Tool·같은 자료</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="40" y="89">설명용 비교 · 실제 성능 실험 결과가 아님 · 스킬이 없어도 올바른 답변은 가능</tspan></text><rect x="40" y="120" width="1300" height="95" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="156">동일 요청</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="190">‘이 회의의 결론과 후속 조치를 정리해줘.’</tspan></text><rect x="40" y="265" width="620" height="155" rx="12" fill="#fff4dd" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="301">스킬 없음</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="335">요청 + 기본 지침 + 모델의 일반 지식으로 계획</tspan><tspan x="58" y="361.6">회의록 Tool은 그대로 사용 가능</tspan><tspan x="58" y="388.2">우리 조직의 정리 기준은 매번 알려줘야 할 수 있음</tspan></text><rect x="720" y="265" width="620" height="155" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="301">관련 스킬 있음</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="335">동일 입력 + 필요한 SKILL.md의 절차를 읽음</tspan><tspan x="738" y="361.6">결정/미결 구분 · 담당/기한 확인 · 근거 표시</tspan><tspan x="738" y="388.2">매번 길게 재설명하지 않고 재사용</tspan></text><path d="M350 218 L350 260" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><path d="M1040 218 L1040 260" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="450" width="620" height="155" rx="12" fill="#fff4dd" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="486">가능한 결과 차이</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="520">일반적인 요약은 잘할 수 있음</tspan><tspan x="58" y="546.6">담당·기한·미결 구분이 누락될 수 있음</tspan><tspan x="58" y="573.2">긴 기본 지침으로 동일 규칙을 줄 수도 있음</tspan></text><rect x="720" y="450" width="620" height="155" rx="12" fill="#f1edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="486">기대 효과와 한계</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="520">업무 절차·형식의 일관성 개선을 기대</tspan><tspan x="738" y="546.6">읽기 비용·잘못된 선택·지침 충돌은 늘 수 있음</tspan><tspan x="738" y="573.2">문서가 잘못되면 오히려 품질이 나빠질 수 있음</tspan></text><path d="M350 398 L350 445" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><path d="M1040 398 L1040 445" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="640" width="1300" height="180" rx="12" fill="#e7f6ef" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="676">검증으로 확인할 것</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="710">같은 조건에서 스킬 ON/OFF를 비교: 결정·미결·담당·기한·근거 누락 여부</tspan><tspan x="58" y="736.6">사용하면 안 되는 요청에서 불필요한 스킬을 읽지 않는지도 확인</tspan><tspan x="58" y="763.2">지연·토큰·Tool 호출 수를 함께 측정 / 권한·정확성을 스킬만으로 보장하지 않음</tspan></text></svg>
