<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1560" viewBox="0 0 1420 1560"><title>완성 후 화면 | 에이전트 만들기</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#27364b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text fill="#27364b" font-size="32" font-family="Malgun Gothic, sans-serif"><tspan x="40" y="54">완성 후 화면 | 에이전트 만들기</tspan></text><text fill="#596579" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="40" y="90">완성 후 목표 시안 · 현재 구현 화면/동작이 아님 · 2026-10-02</tspan></text><rect x="40" y="120" width="910" height="1385" rx="12" fill="#fafbfc" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="28" font-family="Malgun Gothic, sans-serif"><tspan x="65" y="168">에이전트 만들기</tspan></text><text fill="#27364b" font-size="22" font-family="Malgun Gothic, sans-serif"><tspan x="65" y="209">생성 방식   ○ 기존 방식      ● 템플릿 방식</tspan></text><rect x="65" y="240" width="860" height="160" rx="12" fill="#eef5ff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="275">1  기본 정보</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="307">이름   [ 회의 도우미                         ]</tspan><tspan x="83" y="331.3">호출명 [ @meeting-helper                    ]</tspan><tspan x="83" y="355.6">설명   [ 회의 자료 검색과 결론 정리          ]</tspan></text><rect x="65" y="425" width="860" height="190" rx="12" fill="#eef5ff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="460">2  모델과 기본 지침</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="492">모델 [ 관리자가 허용한 모델 ▼ ]    출력 상한 [ 8000 ]</tspan><tspan x="83" y="516.3">최대 라운드 [ 8 ]                  추론 강도 [ 모델별 지원 ]</tspan><tspan x="83" y="540.6">기본 지침 [ 사용자의 질문에 근거를 들어 답합니다.             ]</tspan><tspan x="83" y="564.9">※ 예시 값이며 기본값·실제 항목은 후속 설계에서 확정</tspan></text><rect x="65" y="640" width="860" height="125" rx="12" fill="#eef5ff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="675">3  사용할 Tool</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="707">[✓] 회의록 검색   [✓] 회의록 질문   [✓] 장시간 자료 분석</tspan><tspan x="83" y="731.3">목록은 현재 사용자·Agent에 허용된 Tool만 표시</tspan></text><rect x="65" y="790" width="860" height="170" rx="12" fill="#e8f7f5" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="825">4  백그라운드 허용 여부</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="857">[ ON  ● ]  백그라운드 작업 허용</tspan><tspan x="83" y="881.3">Tool이 실제 작업을 접수하면 스레드에 진행 안내를 표시합니다.</tspan><tspan x="83" y="905.6">OFF이면 백그라운드 실행을 허용하지 않습니다.</tspan><tspan x="83" y="929.9">※ ON은 화면 예시이며 신규 Agent 기본값 확정이 아닙니다.</tspan></text><rect x="65" y="985" width="860" height="210" rx="12" fill="#f4efff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="1020">5  사용할 스킬</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="1052">[✓] 회의 주요 사안 정리     v1     [내용 보기]</tspan><tspan x="83" y="1076.3">[✓] 근거를 포함한 보고서    v2     [내용 보기]</tspan><tspan x="83" y="1100.6">[  ] 데이터 표 작성          v1     [내용 보기]</tspan><tspan x="83" y="1124.9">체크 = 사용 가능한 스킬 연결 / 매번 본문 전체 주입 아님</tspan><tspan x="83" y="1149.2">공용 파일은 복사하지 않고 선택한 버전을 참조합니다.</tspan></text><rect x="65" y="1220" width="860" height="170" rx="12" fill="#f4efff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="1255">6  이 Agent에 필요한 스킬 직접 작성</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="83" y="1287">제목 [ 회의 후속 조치 정리 ]         [MD 편집/미리보기]</tspan><tspan x="83" y="1311.3">내용 [ 적용 상황 · 작업 순서 · 결과 형식 ...                ]</tspan><tspan x="83" y="1335.6">공유 범위 [ 이 Agent에서만 사용 ▼ ]</tspan><tspan x="83" y="1359.9">저장 후 스킬 파일을 등록하고 이 Agent에 연결합니다.</tspan></text><rect x="620" y="1420" width="130" height="50" rx="12" fill="#ffffff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="22" font-family="Malgun Gothic, sans-serif"><tspan x="651" y="1452">취소</tspan></text><rect x="770" y="1420" width="155" height="50" rx="12" fill="#dcecff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="22" font-family="Malgun Gothic, sans-serif"><tspan x="787" y="1452">Agent 저장</tspan></text><rect x="990" y="240" width="385" height="140" rx="12" fill="#f5f5f5" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="275">기존 고객사 보존</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="307">기존 방식 선택 시 기존 화면·실행</tspan><tspan x="1008" y="331.3">새 설정을 기존 Agent에 강제하지 않음</tspan><tspan x="1008" y="355.6">@ 호출은 기존과 동일</tspan></text><rect x="990" y="425" width="385" height="165" rx="12" fill="#f0f7ed" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="460">저장되는 정보</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="492">공통 정의 → agents / 버전 이력</tspan><tspan x="1008" y="516.3">허용 정책 → 별도 설정 테이블</tspan><tspan x="1008" y="540.6">스킬 선택 → Agent–스킬 연결</tspan><tspan x="1008" y="564.9">스킬 본문 → 파일 저장소</tspan></text><rect x="990" y="640" width="385" height="150" rx="12" fill="#fff5df" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="675">Tool과 스킬은 별개</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="707">Tool: 실제 작업을 수행</tspan><tspan x="1008" y="731.3">스킬: 어떤 절차로 수행할지 안내</tspan><tspan x="1008" y="755.6">스킬 선택이 Tool 권한을 주지 않음</tspan></text><rect x="990" y="985" width="385" height="185" rx="12" fill="#f4efff" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="1020">스킬 파일 사용 방식</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="1052">등록된 스킬을 A·B가 함께 선택 가능</tspan><tspan x="1008" y="1076.3">체크만으로 파일을 재생성하지 않음</tspan><tspan x="1008" y="1100.6">특화 스킬도 같은 구조에 저장</tspan><tspan x="1008" y="1124.9">파일 위치·버전·공유 범위는 DB 관리</tspan></text><rect x="990" y="1220" width="385" height="170" rx="12" fill="#fff5df" stroke="#27364b" stroke-width="1.5"/><text fill="#27364b" font-size="23" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="1255">저장 전 확인</tspan></text><text fill="#27364b" font-size="18" font-family="Malgun Gothic, sans-serif"><tspan x="1008" y="1287">스킬 파일과 버전의 존재·접근권한</tspan><tspan x="1008" y="1311.3">Tool 허용 범위·입력값 검증</tspan><tspan x="1008" y="1335.6">신규 설정 누락 시 조용한 우회 금지</tspan><tspan x="1008" y="1359.9">기존 파일 버전을 덮어쓰지 않음</tspan></text></svg>
