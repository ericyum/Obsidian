<text x="58" y="175" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="58" dy="0">Agent A / 버전 1</tspan><tspan x="58" dy="25.2">모델·기본 지침 등 공통 설정</tspan></text>
<rect x="580" y="105" width="480" height="115" rx="12" fill="#e8f5ed" stroke="#24374d" stroke-width="2"/>
<text x="598" y="140" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#24374d"><tspan x="598" dy="0">신규 agent_template_versions</tspan></text>
<text x="598" y="175" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="598" dy="0">동일한 Agent A / 버전 1에 연결</tspan><tspan x="598" dy="25.2">스킬 연결·백그라운드 정책도 별도 보관</tspan></text>
