<text x="278" y="325" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#24374d"><tspan x="278" dy="0">실행에 고정된 ID·버전으로 조회</tspan></text>
<text x="278" y="360" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="278" dy="0">적용 환경에서 해당 버전의 연결 존재 확인</tspan></text>
<rect x="40" y="470" width="320" height="115" rx="12" fill="#e8f1ff" stroke="#24374d" stroke-width="2"/>
<text x="58" y="505" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#24374d"><tspan x="58" dy="0">정상 조회: 연결 없음</tspan></text>
<text x="58" y="540" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="58" dy="0">기존 일반 조립·실행</tspan><tspan x="58" dy="25.2">기존 고객 행 수정 없음</tspan></text>
<rect x="390" y="470" width="320" height="115" rx="12" fill="#e8f5ed" stroke="#24374d" stroke-width="2"/>
<text x="408" y="505" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#24374d"><tspan x="408" dy="0">정상 조회: 연결 있음</tspan></text>
<text x="408" y="540" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="408" dy="0">공통 + 템플릿 조립</tspan><tspan x="408" dy="25.2">고정된 스킬 버전 사용</tspan></text>
