<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740"><rect width="1100" height="740" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b"/></marker></defs><text x="40" y="53" font-family="Malgun Gothic,sans-serif" font-size="28" fill="#24374d"><tspan x="40" dy="0">공통 정의 버전 + 템플릿 확장 정보</tspan></text>
