<text x="758" y="505" font-family="Malgun Gothic,sans-serif" font-size="21" fill="#24374d"><tspan x="758" dy="0">조회 실패·설정 누락</tspan></text>
<text x="758" y="540" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="758" dy="0">오류 처리 / 실행 차단</tspan><tspan x="758" dy="25.2">일반 실행으로 우회 금지</tspan></text>
<text x="40" y="668" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#24374d"><tspan x="40" dy="0">기능 미적용 환경은 기존 경로 유지 · 새 템플릿 활성화 전 전체 worker 지원 확인</tspan><tspan x="40" dy="25.2">신규 연결 정보는 공통 정의 버전과 원자적으로 저장한다.</tspan></text></svg>
