<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1630" viewBox="0 0 1380 1630"><title>완성 후 실행 순서 | 하나의 Tool 흐름 + 선택적 실행 기능</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#293a50"/></marker></defs><rect width="100%" height="100%" fill="white"/><text font-family="Malgun Gothic,sans-serif" font-size="30" fill="#293a50"><tspan x="40" y="50">완성 후 실행 순서 | 하나의 Tool 흐름 + 선택적 실행 기능</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="40" y="89">목표 시안 · HITL과 백그라운드는 Tool 종류가 아니라 필요에 따라 사용하는 기능</tspan></text><rect x="40" y="120" width="620" height="110" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="156">준비  화면에서 Agent 저장</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="190">정의·버전 / Tool / 스킬 연결 / 백그라운드 허용</tspan><tspan x="58" y="216.6">스킬 본문은 파일 저장소, 설정·연결은 DB</tspan></text><rect x="720" y="120" width="620" height="110" rx="12" fill="#f4f4f4" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="156">기존 경로 보존</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="190">기존 Agent는 기존대로 실행</tspan><tspan x="738" y="216.6">신규 방식만 필요한 공통 기능을 추가 조립</tspan></text><rect x="40" y="275" width="620" height="110" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="311">1  @Agent 호출 → 권한·실행 버전 확인</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="345">현재 접근권한과 사용할 정의·설정·스킬 버전 확인</tspan><tspan x="58" y="371.6">claim·중복 방지·원자적 저장 보장은 유지</tspan></text><path d="M350 233 L350 270" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="275" width="620" height="110" rx="12" fill="#f2edff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="738" y="311">2  모델·문맥·Tool·스킬 사용 경로 조립</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="738" y="345">기존 기반 재사용 → 관련 스킬의 SKILL.md 읽기</tspan><tspan x="738" y="371.6">필요한 참조만 로드, 불필요한 스킬은 읽지 않음</tspan></text><path d="M664 327 L715 327" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="430" width="640" height="90" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="388" y="466">3  요청 판단 → 필요하면 Tool 호출</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="388" y="500">Tool 없이 바로 답변 가능 / Tool 결과를 보고 추가 판단</tspan></text><path d="M1030 389 L850 425" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="570" width="1300" height="705" rx="12" fill="#f8fbff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="26" fill="#293a50"><tspan x="62" y="613">4  Tool 처리 — 아래 기능은 독립적으로 선택·조합</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="20" fill="#293a50"><tspan x="62" y="653">같은 Tool이라도 입력·진행 상태에 따라 둘 다 안 쓰거나, 하나만 쓰거나, 둘 다 사용할 수 있음</tspan></text><rect x="70" y="690" width="1240" height="85" rx="12" fill="#e9f1fc" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="88" y="726">공통  입력·권한 확인 → 업무 처리</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="88" y="760">스킬은 절차를 안내하고, 실행 가능 여부·상태 전환은 코드가 검증</tspan></text><path d="M690 523 L690 564" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="820" width="595" height="160" rx="12" fill="#fff3d9" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="88" y="856">선택 기능 ① HITL</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="88" y="890">추가 입력/확인이 필요할 때만 사용</tspan><tspan x="88" y="916.6">대기 상태 저장 → 스레드에 질문</tspan><tspan x="88" y="943.2">사용자 응답 → 권한 확인 → Tool 절차 재개</tspan></text><rect x="710" y="820" width="600" height="160" rx="12" fill="#e6f6f1" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="728" y="856">선택 기능 ② 백그라운드</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="728" y="890">작업을 비동기로 계속할 때만 사용</tspan><tspan x="728" y="916.6">Agent 허용 정책 검사 → 실제 작업 접수</tspan><tspan x="728" y="943.2">접수 확인 후 안내 → 완료 통지로 이어가기</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="80" y="1036">조합 예: 같은 ‘자료 분석’ Tool</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="21" fill="#293a50"><tspan x="80" y="1076">• 입력 충분·짧은 작업: 바로 결과 반환</tspan><tspan x="80" y="1105.4">• 대상 불명확: HITL로 대상 확인 → 결과 반환</tspan><tspan x="80" y="1134.8">• 장시간 작업: 백그라운드 접수 → 완료 결과 전달</tspan><tspan x="80" y="1164.2">• 둘 다 필요: HITL로 대상 확인 → 백그라운드 접수 → 완료 결과 전달</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="80" y="1214">이 순서는 설명용 예시입니다. 실제 필요 시점·재개 지점은 Tool 계약에 따릅니다.</tspan></text><rect x="40" y="1320" width="800" height="115" rx="12" fill="#eef5ff" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="1356">5  결과 사용 → 응답·상태 확정 → 스레드 게시</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="1390">대기/접수 안내와 최종 결과는 서로 다른 시점일 수 있음</tspan><tspan x="58" y="1416.6">후속 질문과 완료 통지는 필요한 상태를 이어받아 처리</tspan></text><path d="M680 1278 L430 1315" fill="none" stroke="#293a50" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="1320" width="440" height="140" rx="12" fill="#fff3d9" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="918" y="1356">백그라운드 OFF라면</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="918" y="1390">비동기 실행은 금지·안내</tspan><tspan x="918" y="1416.6">Tool 전체가 항상 금지라는 뜻은 아님</tspan><tspan x="918" y="1443.2">동기 대체는 명시적 계약이 있을 때만</tspan></text><rect x="40" y="1475" width="1300" height="110" rx="12" fill="#f4f4f4" stroke="#293a50"/><text font-family="Malgun Gothic,sans-serif" font-size="24" fill="#293a50"><tspan x="58" y="1511">전 과정 관찰</tspan></text><text font-family="Malgun Gothic,sans-serif" font-size="19" fill="#293a50"><tspan x="58" y="1545">사용자 Trace: 메모리 / 관리자 실행 이력: DB · LLM 추론 텍스트는 보류</tspan><tspan x="58" y="1571.6">Tool 내부 subagent는 외부 실행 계약으로 취급하며 별도 오케스트레이터를 만들지 않음</tspan></text></svg>
