<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860"><rect width="1180" height="860" fill="#f8fafc"/><text font-family="Malgun Gothic, sans-serif" font-size="29" fill="#1e293b"><tspan x="45" y="54">팀 만들기  |  템플릿 방식의 후속 단계 개념안</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="19" fill="#475569"><tspan x="45" y="92">단독 Agent 검증 이후 · 순차 실행 예시 · 구현 화면 아님</tspan></text><rect x="45" y="120" width="1090" height="665" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="24" fill="#1e293b"><tspan x="75" y="169">에이전트 팀 만들기</tspan></text><rect x="75" y="195" width="1030" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="590" y="200" width="510" height="42" rx="10" fill="#dbeafe" stroke="#2563eb"/><text font-family="Malgun Gothic, sans-serif" font-size="20" fill="#1e293b"><tspan x="255" y="226">기존 방식</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="20" fill="#1e293b"><tspan x="765" y="226">템플릿 방식</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="20" fill="#1e293b"><tspan x="75" y="289">팀 이름</tspan></text><rect x="75" y="304" width="1030" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="19" fill="#1e293b"><tspan x="90" y="334">자료 정리 팀</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="22" fill="#1e293b"><tspan x="75" y="401">1. 참여 Agent와 실행 관계</tspan></text><rect x="75" y="422" width="380" height="90" rx="10" fill="#eff6ff" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1e293b"><tspan x="92" y="453">Agent A · 자료 검색</tspan><tspan x="92" y="478.2">허용된 기존 Agent 선택  ▾</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="22" fill="#1e293b"><tspan x="477" y="471">순차 실행 →</tspan></text><rect x="725" y="422" width="380" height="90" rx="10" fill="#eff6ff" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="18" fill="#1e293b"><tspan x="742" y="453">Agent B · 요약 작성</tspan><tspan x="742" y="478.2">허용된 기존 Agent 선택  ▾</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="22" fill="#1e293b"><tspan x="75" y="561">2. 전달값 설정</tspan></text><rect x="75" y="580" width="1030" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="20" fill="#1e293b"><tspan x="93" y="619">A의 출력: documents   →   B의 입력: sourceDocuments</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="17" fill="#475569"><tspan x="75" y="676">예시 필드명 · 실제 스키마는 조사 후 확정 / 전체 대화·State 자동 공유 안 함</tspan></text><rect x="875" y="715" width="95" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b"><tspan x="903" y="743">취소</tspan></text><rect x="985" y="715" width="120" height="44" rx="10" fill="#dbeafe" stroke="#2563eb"/><text font-family="Malgun Gothic, sans-serif" font-size="17" fill="#1e293b"><tspan x="1007" y="743">팀 만들기</tspan></text><text font-family="Malgun Gothic, sans-serif" font-size="19" fill="#1e293b"><tspan x="45" y="834">※ 상하 위임·병렬 실행·결과 취합 편집은 후속 설계 대상입니다.</tspan></text></svg>
