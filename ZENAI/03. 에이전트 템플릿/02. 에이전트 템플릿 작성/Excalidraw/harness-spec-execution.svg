<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="750" viewBox="0 0 1020 750"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="60" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="bold" fill="#123047">04  스킬 지침을 읽고 도구를 실행하는 순서</text><path d="M460 175 L540 175" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M750 240 L250 310" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M460 375 L540 375" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M750 440 L250 510" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M250 440 L750 510" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M750 440 L750 510" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="110" width="420" height="130" rx="14" fill="#eaf2fc" stroke="#456879" stroke-width="2"/><text x="60" y="145" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">조립 안내</text><text x="60" y="186" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">기본 지침 + 선택 스킬 목록</text><text x="60" y="213" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">이름 · 요약 · 적용 상황 · 경로</text><rect x="540" y="110" width="420" height="130" rx="14" fill="#e9f5f1" stroke="#456879" stroke-width="2"/><text x="560" y="145" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">사용자 요청과 매칭</text><text x="560" y="186" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">전용 / 공용 / 복합 시나리오</text><text x="560" y="213" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">일반 질문은 조회 없이 답변 가능</text><rect x="40" y="310" width="420" height="130" rx="14" fill="#eaf2fc" stroke="#456879" stroke-width="2"/><text x="60" y="345" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">read_file로 매뉴얼 조회</text><text x="60" y="386" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">전용: sectionId의 본문</text><text x="60" y="413" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">공용: 해당 형식 매뉴얼</text><rect x="540" y="310" width="420" height="130" rx="14" fill="#e9f5f1" stroke="#456879" stroke-width="2"/><text x="560" y="345" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">도구 실행 직전 검사</text><text x="560" y="386" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">읽은 항목의 허용 도구 확인</text><text x="560" y="413" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">실제 권한 확인 후 기존 도구 실행</text><rect x="40" y="510" width="420" height="130" rx="14" fill="#eaf2fc" stroke="#456879" stroke-width="2"/><text x="60" y="545" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">최종 답변</text><text x="60" y="586" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">성공 결과 또는 제한·실패 안내</text><text x="60" y="613" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">도구가 없으면 실행했다고 말하지 않음</text><rect x="540" y="510" width="420" height="130" rx="14" fill="#e9f5f1" stroke="#456879" stroke-width="2"/><text x="560" y="545" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">관측 trace</text><text x="560" y="586" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">선택 · 읽기 · 매칭 · 모델/도구 상태</text><text x="560" y="613" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">시간 포함 / 비공개 추론 아님</text></svg>