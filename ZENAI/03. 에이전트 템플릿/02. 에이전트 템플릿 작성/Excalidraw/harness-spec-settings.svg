<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="530" viewBox="0 0 1020 530"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="40" y="60" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="bold" fill="#123047">01  공유 기반 위에 하네스 설정을 추가</text><path d="M250 240 L500 320" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><path d="M750 240 L500 320" fill="none" stroke="#607d8b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="110" width="420" height="130" rx="14" fill="#eaf2fc" stroke="#456879" stroke-width="2"/><text x="60" y="145" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">기존 설정 재사용</text><text x="60" y="186" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">이름 · 모델 · 기본 지침</text><text x="60" y="213" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">실행 한도 · 작업 공간 · 사용자 부여</text><rect x="540" y="110" width="420" height="130" rx="14" fill="#e9f5f1" stroke="#456879" stroke-width="2"/><text x="560" y="145" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">하네스 전용 설정</text><text x="560" y="186" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">전용 SKILL.md + 시나리오별 도구</text><text x="560" y="213" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">문서 작성 체크 / 백그라운드 OFF</text><rect x="290" y="320" width="420" height="130" rx="14" fill="#eaf2fc" stroke="#456879" stroke-width="2"/><text x="310" y="355" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="bold" fill="#123047">같은 Agent로 저장</text><text x="310" y="396" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">기본 정의는 agents / agent_versions</text><text x="310" y="423" font-family="Malgun Gothic,sans-serif" font-size="18" fill="#234052">전용 설정은 확장 테이블에 연결</text></svg>