<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><rect width="1500" height="890" fill="white"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="45" y="57" font-size="32" fill="#0f172a"><tspan x="45" dy="0">목표·상태·상황 → 판단 → 구현 → 검증</tspan></text><text x="45" y="100" font-size="20" fill="#64748b"><tspan x="45" dy="0">기술 선택보다 사용자 결과와 운영 환경을 먼저 확정한다.</tspan></text><rect x="45" y="150" width="440" height="190" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="67" y="192" font-size="24" fill="#2563eb"><tspan x="67" dy="0">목표</tspan></text><text x="67" y="233" font-size="20" fill="#334155"><tspan x="67" dy="0">공지 카드에서 업무 효과 이해</tspan><tspan x="67" dy="28">개인 연습방에서 실제 AI 체험</tspan><tspan x="67" dy="28">재접속 시 안내 중복 방지</tspan></text><rect x="530" y="150" width="440" height="190" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="552" y="192" font-size="24" fill="#7c3aed"><tspan x="552" dy="0">상태</tspan></text><text x="552" y="233" font-size="20" fill="#334155"><tspan x="552" dy="0">시안·설계는 확보</tspan><tspan x="552" dy="28">공지/진행 DB·제품 UI는 미구현</tspan><tspan x="552" dy="28">기존 Builtin 실행 기반은 재사용</tspan></text><rect x="1015" y="150" width="440" height="190" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="1037" y="192" font-size="24" fill="#c2410c"><tspan x="1037" dy="0">상황</tspan></text><text x="1037" y="233" font-size="20" fill="#334155"><tspan x="1037" dy="0">고객사별 커뮤니티 격리</tspan><tspan x="1037" dy="28">실제 채널·동료가 서비스 이용 중</tspan><tspan x="1037" dy="28">운영 배포·DB를 건드리지 않음</tspan></text><rect x="45" y="425" width="440" height="230" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="67" y="467" font-size="24" fill="#15803d"><tspan x="67" dy="0">차이를 해결하는 판단</tspan></text><text x="67" y="508" font-size="20" fill="#334155"><tspan x="67" dy="0">공지 전용 데이터 + 관리 화면</tspan><tspan x="67" dy="28">연습 도우미 Builtin + 계정 진행</tspan><tspan x="67" dy="28">공개 가입/동료 초대는 모의 안내</tspan><tspan x="67" dy="28">실제 체험은 개인 비공개 방</tspan></text><rect x="530" y="425" width="440" height="230" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="552" y="467" font-size="24" fill="#0f172a"><tspan x="552" dy="0">단계별 구현</tspan></text><text x="552" y="508" font-size="20" fill="#334155"><tspan x="552" dy="0">A. 공지 카드·게시·권한</tspan><tspan x="552" dy="28">B. 연습 Builtin·실제 답변</tspan><tspan x="552" dy="28">C. 첫 소개·우측 바·진행 복원</tspan><tspan x="552" dy="28">intent → 하네스 → 교차 검토</tspan></text><rect x="1015" y="425" width="440" height="230" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="1037" y="467" font-size="24" fill="#0f172a"><tspan x="1037" dy="0">검증과 증거</tspan></text><text x="1037" y="508" font-size="20" fill="#334155"><tspan x="1037" dy="0">전용 DB·합성 계정·별도 포트</tspan><tspan x="1037" dy="28">4종 게이트 + 권한 부정 테스트</tspan><tspan x="1037" dy="28">브라우저 E2E + 실제 AI run</tspan><tspan x="1037" dy="28">미완료·제약을 결과에 명시</tspan></text><path d="M260 345 l0 70" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 540 l37 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M970 540 l37 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="811" font-size="21" fill="#166534"><tspan x="45" dy="0">모든 새 기능 기본 OFF · 기존 작업 보존 · 운영 배포/운영 DB 변경 없이 검토 가능한 결과</tspan></text></g></svg>