<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><rect width="1500" height="890" fill="white"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="45" y="57" font-size="32" fill="#0f172a"><tspan x="45" dy="0">튜토리얼: 계정 진행과 실제 AI 성공을 분리해 연결</tspan></text><text x="45" y="100" font-size="20" fill="#64748b"><tspan x="45" dy="0">화면은 우측 체크리스트 + 초록 강조. 첫 방문·나중에 하기·완료를 구분한다.</tspan></text><rect x="45" y="145" width="420" height="230" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="67" y="187" font-size="24" fill="#2563eb"><tspan x="67" dy="0">계정 공통 진행</tspan></text><text x="67" y="228" font-size="20" fill="#334155"><tspan x="67" dy="0">user + tutorial version</tspan><tspan x="67" dy="28">소개 확인 시각·진행·완료</tspan><tspan x="67" dy="28">다른 PC에서도 서버 상태 복원</tspan><tspan x="67" dy="28">나중에 하기는 완료가 아님</tspan></text><rect x="540" y="145" width="420" height="230" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="562" y="187" font-size="24" fill="#7c3aed"><tspan x="562" dy="0">커뮤니티별 개인 연습방</tspan></text><text x="562" y="228" font-size="20" fill="#334155"><tspan x="562" dy="0">사용자 + 커뮤니티별 비공개 방</tspan><tspan x="562" dy="28">중복 시작은 같은 채널 재사용</tspan><tspan x="562" dy="28">실제 동료 초대·공개 가입 없음</tspan><tspan x="562" dy="28">권한 있는 연습 도우미 초대</tspan></text><rect x="1035" y="145" width="420" height="230" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1057" y="187" font-size="24" fill="#15803d"><tspan x="1057" dy="0">tutorial.assistant Builtin</tspan></text><text x="1057" y="228" font-size="20" fill="#334155"><tspan x="1057" dy="0">공통 worker·스킬·Trace 재사용</tspan><tspan x="1057" dy="28">도구는 고정 가상 메모만 반환</tspan><tspan x="1057" dy="28">실제 모델이 첫/후속 답변 생성</tspan><tspan x="1057" dy="28">회의·SAP·MCP 업무 수행 없음</tspan></text><rect x="795" y="485" width="660" height="205" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="817" y="527" font-size="24" fill="#0f172a"><tspan x="817" dy="0">서버가 완료 근거 확인</tspan></text><text x="817" y="568" font-size="20" fill="#334155"><tspan x="817" dy="0">본인·연습방·tutorial principal·같은 root</tspan><tspan x="817" dy="28">실제 성공 run + 게시된 답변 이벤트</tspan><tspan x="817" dy="28">도구 실행·클라이언트 플래그만으로 완료 불가</tspan></text><rect x="45" y="485" width="655" height="205" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="67" y="527" font-size="24" fill="#0f172a"><tspan x="67" dy="0">완료 후 재접속과 2회차</tspan></text><text x="67" y="568" font-size="20" fill="#334155"><tspan x="67" dy="0">자동 소개 재노출 없음 · 메뉴로 다시 열기</tspan><tspan x="67" dy="28">새 root에서 “한 번 더 연습”</tspan><tspan x="67" dy="28">2회차에도 초록 강조 · 실패/취소는 완료 아님</tspan></text><path d="M465 260 l65 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 260 l65 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1230 385 l0 82" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M795 580 l-80 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="811" font-size="21" fill="#166534"><tspan x="45" dy="0">초기 1회차 + 후속 질문은 기본 체험 · 2회차는 선택 제공 · 강제 단계 수는 사용자 자문 후 조정</tspan></text></g></svg>