<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="890" viewBox="0 0 1500 890"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs><rect width="1500" height="890" fill="white"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="45" y="57" font-size="32" fill="#0f172a"><tspan x="45" dy="0">공지사항: 작성부터 사용자 이해까지</tspan></text><text x="45" y="100" font-size="20" fill="#64748b"><tspan x="45" dy="0">공지는 사용 권한을 부여하지 않는다. 상세를 열기 전에도 질문과 결과를 보여준다.</tspan></text><rect x="45" y="160" width="420" height="220" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="67" y="202" font-size="24" fill="#2563eb"><tspan x="67" dy="0">커뮤니티 owner/admin</tspan></text><text x="67" y="243" font-size="20" fill="#334155"><tspan x="67" dy="0">제목·업무 효과·적용 조건 입력</tspan><tspan x="67" dy="28">가상의 질문 + 결과 작성</tspan><tspan x="67" dy="28">같은 카드로 미리보기</tspan><tspan x="67" dy="28">저장·게시·회수·재게시</tspan></text><rect x="540" y="160" width="420" height="220" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="562" y="202" font-size="24" fill="#7c3aed"><tspan x="562" dy="0">announcements</tspan></text><text x="562" y="243" font-size="20" fill="#334155"><tspan x="562" dy="0">community_id로 고객사 격리</tspan><tspan x="562" dy="28">draft / published / archived</tspan><tspan x="562" dy="28">최초 게시일 유지</tspan><tspan x="562" dy="28">version 충돌은 409</tspan></text><rect x="1035" y="160" width="420" height="220" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="1057" y="202" font-size="24" fill="#15803d"><tspan x="1057" dy="0">같은 커뮤니티 멤버</tspan></text><text x="1057" y="243" font-size="20" fill="#334155"><tspan x="1057" dy="0">게시본만 조회</tspan><tspan x="1057" dy="28">업무 효과 + 질문 + 결과 확인</tspan><tspan x="1057" dy="28">질문 복사·선택적 상세</tspan><tspan x="1057" dy="28">에이전트 사용 권한은 별도</tspan></text><rect x="45" y="485" width="1410" height="205" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="67" y="527" font-size="24" fill="#0f172a"><tspan x="67" dy="0">운영·보안 경계</tspan></text><text x="67" y="568" font-size="20" fill="#334155"><tspan x="67" dy="0">기능 OFF이면 메뉴/API 비노출 · 다른 커뮤니티·초안·회수본의 직접 URL 차단</tspan><tspan x="67" dy="28">원시 HTML·임의 스크립트·외부 이미지 없음 · 채널 첨부 권한 확장 없음</tspan><tspan x="67" dy="28">첫 버전은 공지 테이블 1개 · 개인 미읽음·이미지 업로드는 필요 확인 후 추가</tspan></text><path d="M465 260 l65 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 260 l65 0" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="811" font-size="21" fill="#166534"><tspan x="45" dy="0">사용자에게 남아야 할 이해: “어떤 업무에 쓰고, 어떤 결과를 받을 수 있는지 알겠다.”</tspan></text></g></svg>