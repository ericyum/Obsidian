<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img"><title>에이전트 구동 로그 권장 기록 범위</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3Z" fill="#475b6b"/></marker></defs><rect width="1100" height="460" fill="#ffffff"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="30" y="48" font-size="28" fill="#172b3a">권장 기록 범위 | 이상이 시작된 경계를 찾을 수 있게 연결</text><text x="30" y="89" font-size="20" fill="#475b6b">일반·하네스·Builtin 공통 적용 · 아래는 아직 구현하지 않은 정책 후보</text><rect x="30" y="123" width="176" height="143" rx="12" fill="#edf4fa" stroke="#c5d0d8"/><text x="43" y="161" font-size="24" fill="#2465a4">접수·준비</text><text x="43" y="204" font-size="19" fill="#172b3a">요청·설정</text><text x="43" y="230.6" font-size="19" fill="#172b3a">권한·버전</text><path d="M210,194.5h30" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/><rect x="246" y="123" width="176" height="143" rx="12" fill="#edf4fa" stroke="#c5d0d8"/><text x="259" y="161" font-size="24" fill="#2465a4">문맥 처리</text><text x="259" y="204" font-size="19" fill="#172b3a">선택·압축 전후</text><text x="259" y="230.6" font-size="19" fill="#172b3a">실제 전송 입력</text><path d="M426,194.5h30" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/><rect x="462" y="123" width="176" height="143" rx="12" fill="#edf4fa" stroke="#c5d0d8"/><text x="475" y="161" font-size="24" fill="#2465a4">모델 호출</text><text x="475" y="204" font-size="19" fill="#172b3a">파라미터·응답</text><text x="475" y="230.6" font-size="19" fill="#172b3a">공개 추론·오류</text><path d="M642,194.5h30" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/><rect x="678" y="123" width="176" height="143" rx="12" fill="#edf4fa" stroke="#c5d0d8"/><text x="691" y="161" font-size="24" fill="#2465a4">도구·스킬</text><text x="691" y="204" font-size="19" fill="#172b3a">선택·권한</text><text x="691" y="230.6" font-size="19" fill="#172b3a">인자·결과</text><path d="M858,194.5h30" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="123" width="176" height="143" rx="12" fill="#edf4fa" stroke="#c5d0d8"/><text x="907" y="161" font-size="24" fill="#2465a4">결과 반영</text><text x="907" y="204" font-size="19" fill="#172b3a">게시·저장</text><text x="907" y="230.6" font-size="19" fill="#172b3a">완료·실패</text><text x="30" y="314" font-size="22" fill="#172b3a">중단 · HITL · 재개 · 백그라운드: 상태·이유·이전/다음 실행 연결을 함께 기록</text><rect x="30" y="345" width="1040" height="90" rx="12" fill="#fff5df" stroke="#c5d0d8"/><text x="47" y="379" font-size="21" fill="#9a6500">본문은 마스킹 후 한 번 보존 + 참조로 연결 · 큰 본문은 한도와 생략 사유 표시</text><text x="47" y="408.4" font-size="21" fill="#9a6500">중복 제거·압축과 실행별/서버 전체 용량·보관기간을 함께 적용</text></g></svg>
