<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img"><title>02-runtime-log-flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#475b6b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Malgun Gothic, Noto Sans KR, Arial, sans-serif"><text x="35" y="55" font-size="31" font-weight="400" fill="#172b3a" text-anchor="start">1단계 | 구동 로그는 실행의 어느 부분을 기록하나?</text>
<text x="35" y="98" font-size="21" font-weight="400" fill="#475b6b" text-anchor="start">현재 구조의 설명 그림 · 모든 코드 자동 기록이 아니라 계측된 실행 경계</text>
<rect x="35" y="135" width="350" height="110" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="55" y="176" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">일반 에이전트</text>
<text x="55" y="216" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">생성된 일반 실행 경로</text>
<rect x="425" y="135" width="350" height="110" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="445" y="176" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">하네스 에이전트</text>
<text x="445" y="216" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">스킬·도구·루프 실행</text>
<rect x="815" y="135" width="350" height="110" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="835" y="176" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">Builtin 에이전트</text>
<text x="835" y="216" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">공통 경계 + 고유 로직</text>
<path d="M210,245 L210,280" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,245 L600,280" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M990,245 L990,280" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="295" width="1130" height="130" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="55" y="336" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">접수 → 설정·권한 확인 → 문맥 조립 → 모델·도구 루프</text>
<text x="55" y="376" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">입력·파라미터·분기·반환값·오류와 상태 변화를 연결</text>
<text x="55" y="405.4" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">중단 / HITL / 재개 / 백그라운드 / 결과 게시도 실행 흐름에 포함</text>
<rect x="35" y="475" width="535" height="175" rx="13" fill="#eff2f5" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="55" y="516" font-size="25" font-weight="400" fill="#475b6b" text-anchor="start">기존 요청 기록 / Trace</text>
<text x="55" y="556" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">기존 DB 실행 이력·span / 원문 가림</text>
<text x="55" y="585.4" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">화면 조회·요청 기록 다운로드의 근거</text>
<text x="55" y="614.8" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">요청 다운로드는 공개 추론 제외</text>
<rect x="630" y="475" width="535" height="175" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="650" y="516" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">구동 로그</text>
<text x="650" y="556" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">서버 비공개 JSONL 파일</text>
<text x="650" y="585.4" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">계측된 로직·분기와 더 상세한 본문</text>
<text x="650" y="614.8" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">새 DB 로그 테이블은 만들지 않음</text>
<path d="M600,425 L600,447 L300,447 L300,465" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600,425 L600,447 L900,447 L900,465" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="705" width="1130" height="145" rx="13" fill="#edf4fa" stroke="#c5d0d8" stroke-width="1.5"/>
<text x="55" y="746" font-size="25" font-weight="400" fill="#2465a4" text-anchor="start">두 화면의 다운로드 버튼은 현재 권한을 다시 확인</text>
<text x="55" y="786" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">에이전트 모니터링 → 사용자별 기록 / 설정 → 에이전트 실행 이력</text>
<text x="55" y="815.4" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start">인증정보는 마스킹 · 수집·부분 수집·파일 부재는 서로 다른 상태</text>
<path d="M900,650 L900,695" fill="none" stroke="#475b6b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="921" font-size="26" font-weight="400" fill="#2465a4" text-anchor="start">목적: “어느 입력과 판단 뒤에 기대와 달라졌는가?”를 추적할 수 있게 남긴다.</text>
<text x="40" y="972" font-size="22" font-weight="400" fill="#475b6b" text-anchor="start">제공자가 반환하지 않은 내부 추론, 미계측 분기, SDK·SQL 내부는 이 파일만으로 알 수 없다.</text>
<text x="40" y="1017" font-size="22" font-weight="400" fill="#9a6500" text-anchor="start">24시간 초과 안내 문구는 실제 서버 파일 자동 삭제 주기를 뜻하지 않는다.</text></g></svg>
