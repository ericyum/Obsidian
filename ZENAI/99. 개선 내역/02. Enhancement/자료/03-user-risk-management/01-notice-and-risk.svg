<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="60" font-size="32" fill="#172b4d"><tspan x="40" dy="0">장애를 빨리 다루고 고객 작업을 지킨다</tspan></text><text x="40" y="102" font-size="20" fill="#52647a"><tspan x="40" dy="0">공통 운영 흐름 제안 · 자동 이메일과 운영 중 대응은 추가 설계 대상</tspan></text><rect x="40" y="150" width="300" height="150" rx="14" fill="#fff5e6" stroke="#becbd8"/><text x="60" y="191" font-size="23" fill="#245bc5"><tspan x="60" dy="0">1 · 탐지와 분류</tspan></text><text x="60" y="235" font-size="20" fill="#172b4d"><tspan x="60" dy="0">오류 종류 · 영향 범위</tspan><tspan x="60" dy="29">관측 근거와 시각 확인</tspan></text><rect x="400" y="150" width="300" height="150" rx="14" fill="#edf4ff" stroke="#becbd8"/><text x="420" y="191" font-size="23" fill="#245bc5"><tspan x="420" dy="0">2 · 운영자 통보</tspan></text><text x="420" y="235" font-size="20" fill="#172b4d"><tspan x="420" dy="0">owner/admin · 개발자</tspan><tspan x="420" dy="29">이메일 발송과 담당 확인</tspan></text><rect x="760" y="150" width="300" height="150" rx="14" fill="#eaf7ef" stroke="#becbd8"/><text x="780" y="191" font-size="23" fill="#245bc5"><tspan x="780" dy="0">3 · 임시 안정화</tspan></text><text x="780" y="235" font-size="20" fill="#172b4d"><tspan x="780" dy="0">유형별 롤백 · 격리</tspan><tspan x="780" dy="29">보류 · 계정/도구 복구</tspan></text><path d="M345,225 L393,225" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><path d="M705,225 L753,225" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><path d="M910,310 L910,380" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><rect x="760" y="390" width="300" height="150" rx="14" fill="#edf4ff" stroke="#becbd8"/><text x="780" y="431" font-size="23" fill="#245bc5"><tspan x="780" dy="0">4 · 개발자 원인 수정</tspan></text><text x="780" y="475" font-size="20" fill="#172b4d"><tspan x="780" dy="0">임시 대응으로 버티는 동안</tspan><tspan x="780" dy="29">실제 원인을 분석 · 수정</tspan></text><rect x="400" y="390" width="300" height="150" rx="14" fill="#eaf7ef" stroke="#becbd8"/><text x="420" y="431" font-size="23" fill="#245bc5"><tspan x="420" dy="0">5 · 복구 확인과 해제</tspan></text><text x="420" y="475" font-size="20" fill="#172b4d"><tspan x="420" dy="0">실제 업무 결과를 확인</tspan><tspan x="420" dy="29">제한 해제 · 복구 안내</tspan></text><rect x="40" y="390" width="300" height="150" rx="14" fill="#edf4ff" stroke="#becbd8"/><text x="60" y="431" font-size="23" fill="#245bc5"><tspan x="60" dy="0">6 · 사건 종료와 개선</tspan></text><text x="60" y="475" font-size="20" fill="#172b4d"><tspan x="60" dy="0">남은 고객 작업 확인</tspan><tspan x="60" dy="29">사건 정리 · 재발 관리</tspan></text><path d="M750,465 L710,465" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><path d="M390,465 L350,465" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="595" width="1020" height="115" rx="14" fill="#fff0f2" stroke="#becbd8"/><text x="62" y="637" font-size="25" fill="#9c3443"><tspan x="62" dy="0">전 과정의 고객 보호</tspan></text><text x="62" y="679" font-size="22" fill="#172b4d"><tspan x="62" dy="0">입력·작업 ID 보존 범위 확인  /  원래 요청 상태 조회  /  중복 재실행 방지</tspan></text><text x="40" y="764" font-size="19" fill="#52647a"><tspan x="40" dy="0">긴급 공지는 고객 안내 수단입니다. 이메일만 발송됐다고 자동 롤백하거나 복구 완료로 보지 않습니다.</tspan></text></g></svg>