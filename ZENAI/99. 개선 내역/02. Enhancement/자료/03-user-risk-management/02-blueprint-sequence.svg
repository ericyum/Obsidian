<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="810"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="60" font-size="32" fill="#172b4d"><tspan x="40" dy="0">네 운영 대응안 안에서 조합할 보호 수단</tspan></text><text x="40" y="100" font-size="20" fill="#52647a"><tspan x="40" dy="0">A~D는 운영 방법 1~4와 구분합니다. 필요한 수단을 상황별로 조합합니다.</tspan></text><rect x="40" y="145" width="1020" height="135" rx="14" fill="#edf4ff" stroke="#becbd8"/><text x="62" y="189" font-size="25" fill="#245bc5"><tspan x="62" dy="0">A · 작업 보존과 정확한 안내</tspan></text><text x="62" y="231" font-size="21" fill="#172b4d"><tspan x="62" dy="0">입력·첨부·접수 상태를 연결하고, 재전송 전에 원래 작업을 확인합니다.</tspan></text><path d="M550,287 L550,329" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="340" width="630" height="170" rx="14" fill="#eaf7ef" stroke="#becbd8"/><text x="62" y="384" font-size="25" fill="#176847"><tspan x="62" dy="0">B · 문제 범위만 보호</tspan></text><text x="62" y="426" font-size="21" fill="#172b4d"><tspan x="62" dy="0">먼저 관찰 모드로 판단을 기록</tspan><tspan x="62" dy="30.45">오탐을 살핀 뒤 확인된 범위부터 적용</tspan></text><rect x="710" y="340" width="350" height="170" rx="14" fill="#fff5e6" stroke="#becbd8"/><text x="732" y="384" font-size="25" fill="#92520b"><tspan x="732" dy="0">D · 변경 노출 관리</tspan></text><text x="732" y="426" font-size="21" fill="#172b4d"><tspan x="732" dy="0">모델·설정·배포 변경 때</tspan><tspan x="732" dy="30.45">검사와 되돌리기 병행</tspan></text><path d="M350,520 L350,568" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="580" width="1020" height="135" rx="14" fill="#ffffff" stroke="#becbd8"/><text x="62" y="624" font-size="25" fill="#172b4d"><tspan x="62" dy="0">C · 안전한 이어하기는 후속 후보</tspan></text><text x="62" y="666" font-size="21" fill="#172b4d"><tspan x="62" dy="0">완료 지점·외부 접수 결과·현재 권한을 확인할 수 있는 특정 업무부터 적용합니다.</tspan></text><text x="40" y="768" font-size="20" fill="#52647a"><tspan x="40" dy="0">핵심: A를 기반으로 B를 관찰부터 시작하고, D는 병행하며, C는 좁은 업무에 나중에 적용합니다.</tspan></text></g></svg>