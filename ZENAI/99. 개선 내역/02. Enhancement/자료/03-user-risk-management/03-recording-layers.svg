<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="60" font-size="32" fill="#172b4d"><tspan x="40" dy="0">필요한 사실을 연결하고, 업무 원문은 다시 복제하지 않는다</tspan></text><text x="40" y="100" font-size="20" fill="#52647a"><tspan x="40" dy="0">기록 범위 제안 · 새 대형 로그 저장소를 먼저 만드는 설계가 아님</tspan></text><rect x="40" y="140" width="1020" height="125" rx="14" fill="#edf4ff" stroke="#becbd8"/><text x="62" y="184" font-size="25" fill="#245bc5"><tspan x="62" dy="0">R0 · 기존 업무 사실 재사용</tspan></text><text x="62" y="226" font-size="21" fill="#172b4d"><tspan x="62" dy="0">접수·실행·종결 상태와 작업 ID, 외부 접수·완료 결과를 연결합니다.</tspan></text><rect x="40" y="290" width="1020" height="125" rx="14" fill="#eaf7ef" stroke="#becbd8"/><text x="62" y="334" font-size="25" fill="#176847"><tspan x="62" dy="0">R1 · 운영 대응과 보호 판단을 기록</tspan></text><text x="62" y="376" font-size="21" fill="#172b4d"><tspan x="62" dy="0">사건·범위·알림/담당 인지·조치·해제·결과를 정책 버전과 연결합니다.</tspan></text><rect x="40" y="440" width="1020" height="125" rx="14" fill="#fff5e6" stroke="#becbd8"/><text x="62" y="484" font-size="25" fill="#92520b"><tspan x="62" dy="0">R2 · 진단 자료는 목적과 용량을 제한</tspan></text><text x="62" y="526" font-size="21" fill="#172b4d"><tspan x="62" dy="0">단계·안전한 오류 코드·지연·관련 trace 참조와 수집 누락 여부를 남깁니다.</tspan></text><rect x="40" y="590" width="1020" height="125" rx="14" fill="#fff0f2" stroke="#becbd8"/><text x="62" y="634" font-size="25" fill="#9c3443"><tspan x="62" dy="0">R3 · 민감한 원문은 기본 비수집</tspan></text><text x="62" y="676" font-size="21" fill="#172b4d"><tspan x="62" dy="0">기존 업무 저장소의 질문·답변·첨부를 위험 관리용 기록에 반복 복제하지 않습니다.</tspan></text><text x="40" y="775" font-size="20" fill="#52647a"><tspan x="40" dy="0">영속성이 필요한 정책·업무 결과와, 사라져도 되는 일시적 건강 신호는 저장 계약을 구분합니다.</tspan></text></g></svg>