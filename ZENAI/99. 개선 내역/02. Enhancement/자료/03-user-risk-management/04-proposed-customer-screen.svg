<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="930" viewBox="0 0 1100 930"><title>고객 화면 예시 · 새 기능은 아직 구현되지 않았습니다</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="60" fill="#172b4d" font-size="32"><tspan x="40" dy="0">고객 화면 예시 · 새 기능은 아직 구현되지 않았습니다</tspan></text><text x="40" y="100" fill="#52647a" font-size="20"><tspan x="40" dy="0">설계 예시 이미지 · 실제 운영 화면 캡처나 동작 증거가 아님</tspan></text><rect x="40" y="135" width="1020" height="690" rx="14" fill="#ffffff" stroke="#becbd8" stroke-width="1.5"/><rect x="40" y="135" width="1020" height="85" rx="14" fill="#fff0f2" stroke="#becbd8" stroke-width="1.5"/><text x="64" y="177" fill="#9c3443" font-size="23"><tspan x="64" dy="0">서비스 안내: 특정 모델의 응답이 지연되고 있습니다.</tspan></text><text x="64" y="207" fill="#52647a" font-size="17"><tspan x="64" dy="0">기존 전역 공지 · 실제 게시 내용은 관리자가 확인하여 작성</tspan></text><text x="1017" y="178" fill="#9c3443" font-size="28"><tspan x="1017" dy="0">×</tspan></text><rect x="40" y="220" width="190" height="605" rx="14" fill="#f3f6fa" stroke="#becbd8" stroke-width="1.5"/><text x="63" y="274" fill="#172b4d" font-size="19"><tspan x="63" dy="0">ZEN AI</tspan><tspan x="63" dy="27.55"></tspan><tspan x="63" dy="27.55">개인 연습방</tspan><tspan x="63" dy="27.55"></tspan><tspan x="63" dy="27.55">공지사항</tspan></text><text x="260" y="273" fill="#172b4d" font-size="25"><tspan x="260" dy="0">나만의 AI 연습방</tspan></text><rect x="260" y="310" width="770" height="155" rx="14" fill="#fff5e6" stroke="#becbd8" stroke-width="1.5"/><text x="282" y="354" fill="#92520b" font-size="25"><tspan x="282" dy="0">이 요청의 접수 여부를 확인하고 있습니다</tspan></text><text x="282" y="396" fill="#172b4d" font-size="21"><tspan x="282" dy="0">같은 내용을 다시 보내기 전에</tspan><tspan x="282" dy="30.45">원래 요청이 접수되었는지 확인해 주세요.</tspan></text><text x="282" y="504" fill="#52647a" font-size="19"><tspan x="282" dy="0">현재 확인된 사실: 접수 상태 미확인 · 새 전송은 아직 하지 않음</tspan></text><rect x="282" y="535" width="225" height="52" rx="14" fill="#245bc5" stroke="#245bc5" stroke-width="1.5"/><text x="308" y="566" fill="#ffffff" font-size="20"><tspan x="308" dy="0">접수 상태 확인</tspan></text><text x="530" y="567" fill="#52647a" font-size="18"><tspan x="530" dy="0">자동 재전송 · 자동 모델 변경 없음</tspan></text><rect x="260" y="630" width="770" height="155" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="282" y="674" fill="#245bc5" font-size="25"><tspan x="282" dy="0">작성 내용은 이 화면에 유지됩니다</tspan></text><text x="282" y="716" fill="#172b4d" font-size="21"><tspan x="282" dy="0">@meeting 회의록의 결정 사항을 정리해 줘.</tspan></text><text x="40" y="879" fill="#172b4d" font-size="20"><tspan x="40" dy="0">상단 공지를 닫아도 보호 정책이 해제되지는 않습니다. 원래 작업 상태 확인과 새 실행은 별도 동작입니다.</tspan></text></g></svg>