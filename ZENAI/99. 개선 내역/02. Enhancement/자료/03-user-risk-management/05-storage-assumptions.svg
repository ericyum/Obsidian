<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700"><title>기록 범위에 따라 보관 용량도 크게 달라진다</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="60" fill="#172b4d" font-size="32"><tspan x="40" dy="0">기록 범위에 따라 보관 용량도 크게 달라진다</tspan></text><text x="40" y="100" fill="#52647a" font-size="20"><tspan x="40" dy="0">가정 계산 · 하루 10,000작업 · 십진 GB · 실제 운영량·압축률·비용 측정이 아님</tspan></text><text x="80" y="168" fill="#172b4d" font-size="23"><tspan x="80" dy="0">작은 관리 추가정보: 작업당 2KB × 30일</tspan></text><rect x="80" y="198" width="1.5085714285714285" height="55" rx="0.3771428571428571" fill="#245bc5" stroke="#245bc5" stroke-width="1.5"/><text x="105" y="231" fill="#172b4d" font-size="24"><tspan x="105" dy="0">0.6GB = 600MB</tspan></text><text x="80" y="343" fill="#172b4d" font-size="23"><tspan x="80" dy="0">상세 자료: 작업당 5MB × 7일</tspan></text><rect x="80" y="375" width="880" height="55" rx="14" fill="#92520b" stroke="#92520b" stroke-width="1.5"/><text x="80" y="474" fill="#92520b" font-size="26"><tspan x="80" dy="0">350GB</tspan></text><text x="73" y="539" fill="#52647a" font-size="19"><tspan x="73" dy="0">0</tspan></text><text x="324.42857142857144" y="539" fill="#52647a" font-size="19"><tspan x="324.42857142857144" dy="0">100</tspan></text><text x="575.8571428571429" y="539" fill="#52647a" font-size="19"><tspan x="575.8571428571429" dy="0">200</tspan></text><text x="827.2857142857142" y="539" fill="#52647a" font-size="19"><tspan x="827.2857142857142" dy="0">300</tspan></text><text x="953" y="539" fill="#52647a" font-size="19"><tspan x="953" dy="0">350</tspan></text><path d="M80,506 L960,506" fill="none" stroke="#becbd8" stroke-width="2"/><text x="80" y="584" fill="#52647a" font-size="20"><tspan x="80" dy="0">같은 가로축(GB)입니다. 첫 막대가 매우 짧은 것은 두 시나리오의 실제 계산 차이입니다.</tspan></text><text x="80" y="631" fill="#52647a" font-size="20"><tspan x="80" dy="0">본문 크기뿐 아니라 보관일도 다릅니다. DB 인덱스·백업·압축·수집 비용은 포함하지 않았습니다.</tspan></text></g></svg>