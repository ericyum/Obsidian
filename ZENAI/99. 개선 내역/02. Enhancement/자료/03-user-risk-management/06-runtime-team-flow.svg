<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="735" viewBox="0 0 1280 735"><title>실행 오류를 다루는 전체 흐름</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="62" fill="#172b4d" font-size="34"><tspan x="40" dy="0">실행 오류를 다루는 전체 흐름</tspan></text><text x="40" y="106" fill="#52647a" font-size="21"><tspan x="40" dy="0">기존 기능을 활용하고, 추가 개선은 ③·④에 집중합니다.</tspan></text><rect x="40" y="170" width="220" height="205" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="58" y="211" fill="#245bc5" font-size="23"><tspan x="58" dy="0">① 장애 발견</tspan></text><text x="58" y="260.2" fill="#172b4d" font-size="20"><tspan x="58" dy="0">실행 중 오류 감지</tspan><tspan x="58" dy="28">기존 기능 활용</tspan></text><path d="M264,270 L281,270" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="170" width="220" height="205" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="303" y="211" fill="#245bc5" font-size="23"><tspan x="303" dy="0">② 개발팀 통보</tspan></text><text x="303" y="260.2" fill="#172b4d" font-size="20"><tspan x="303" dy="0">개발자 오류 메일</tspan><tspan x="303" dy="28">구축 완료</tspan></text><path d="M509,270 L526,270" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="530" y="170" width="220" height="205" rx="14" fill="#fff5e6" stroke="#becbd8" stroke-width="1.5"/><text x="548" y="211" fill="#92520b" font-size="23"><tspan x="548" dy="0">③ 임시 안정화</tspan></text><text x="548" y="260.2" fill="#172b4d" font-size="20"><tspan x="548" dy="0">문제 범위 한정</tspan><tspan x="548" dy="28">복귀·제한 적용</tspan><tspan x="548" dy="28">연결 복구</tspan></text><path d="M754,270 L771,270" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="775" y="170" width="220" height="205" rx="14" fill="#ffffff" stroke="#becbd8" stroke-width="1.5"/><text x="793" y="211" fill="#172b4d" font-size="23"><tspan x="793" dy="0">원인 수정·배포</tspan></text><text x="793" y="260.2" fill="#172b4d" font-size="20"><tspan x="793" dy="0">팀에서 원인 수정</tspan><tspan x="793" dy="28">필요한 경우 배포</tspan></text><path d="M999,270 L1016,270" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="1020" y="170" width="220" height="205" rx="14" fill="#eaf7ef" stroke="#becbd8" stroke-width="1.5"/><text x="1038" y="211" fill="#176847" font-size="23"><tspan x="1038" dy="0">⑤ 복구 확인</tspan></text><text x="1038" y="260.2" fill="#172b4d" font-size="20"><tspan x="1038" dy="0">문제 경로 호출</tspan><tspan x="1038" dy="28">정상 동작 확인</tspan><tspan x="1038" dy="28">해제·복구 안내</tspan></text><text x="40" y="429" fill="#52647a" font-size="22"><tspan x="40" dy="0">긴급 공지: 임시 안정화의 사용자 안내 · 복구 확인 후 정상화 안내</tspan></text><rect x="40" y="480" width="1200" height="140" rx="14" fill="#eaf7ef" stroke="#becbd8" stroke-width="1.5"/><text x="58" y="521" fill="#176847" font-size="23"><tspan x="58" dy="0">④ 사용자 작업 보호 · 전체 과정에 적용</tspan></text><text x="58" y="570.2" fill="#172b4d" font-size="20"><tspan x="58" dy="0">입력·첨부 보존 범위 확인 → 기존 요청 상태 조회 → 중복 실행·추가 비용 억제</tspan></text><text x="40" y="684" fill="#52647a" font-size="21"><tspan x="40" dy="0">청사진: ③·④는 기존 지원 범위를 확인한 뒤 부족한 부분을 보완합니다.</tspan></text></g></svg>