<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="805" viewBox="0 0 1280 805"><title>다시 실행하기 전에 기존 작업부터 확인</title><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#52647a" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, sans-serif"><text x="40" y="62" fill="#172b4d" font-size="34"><tspan x="40" dy="0">다시 실행하기 전에 기존 작업부터 확인</tspan></text><text x="40" y="106" fill="#52647a" font-size="21"><tspan x="40" dy="0">오류가 보였다는 사실과, 업무가 처리되지 않았다는 사실은 다릅니다.</tspan></text><rect x="40" y="145" width="1200" height="100" rx="14" fill="#fff5e6" stroke="#becbd8" stroke-width="1.5"/><text x="58" y="181" fill="#92520b" font-size="22"><tspan x="58" dy="0">오류로 답변이 보이지 않음</tspan></text><text x="58" y="216.8" fill="#172b4d" font-size="19"><tspan x="58" dy="0">작성한 내용과 확인 가능한 요청 정보를 유지</tspan></text><path d="M640,250 L640,282" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="295" width="1200" height="105" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="58" y="331" fill="#245bc5" font-size="22"><tspan x="58" dy="0">기존 요청·실행·외부 처리 결과 조회</tspan></text><text x="58" y="366.8" fill="#172b4d" font-size="19"><tspan x="58" dy="0">메시지·run/task·외부 결과를 대조해 다음 행동 결정</tspan></text><path d="M640,405 L640,445" fill="none" stroke="#52647a" stroke-width="2"/><path d="M175,445 L1105,445" fill="none" stroke="#52647a" stroke-width="2"/><path d="M175,445 L175,472" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="485" width="270" height="185" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="58" y="526" fill="#245bc5" font-size="23"><tspan x="58" dy="0">접수되지 않음</tspan></text><text x="58" y="575.2" fill="#172b4d" font-size="20"><tspan x="58" dy="0">입력 보존 확인</tspan><tspan x="58" dy="28">안전하게 재전송</tspan></text><path d="M485,445 L485,472" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="485" width="270" height="185" rx="14" fill="#edf4ff" stroke="#becbd8" stroke-width="1.5"/><text x="368" y="526" fill="#245bc5" font-size="23"><tspan x="368" dy="0">접수·진행 중</tspan></text><text x="368" y="575.2" fill="#172b4d" font-size="20"><tspan x="368" dy="0">원래 작업 계속 조회</tspan><tspan x="368" dy="28">새 중복 실행 억제</tspan></text><path d="M795,445 L795,472" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="485" width="270" height="185" rx="14" fill="#eaf7ef" stroke="#becbd8" stroke-width="1.5"/><text x="678" y="526" fill="#176847" font-size="23"><tspan x="678" dy="0">완료됨</tspan></text><text x="678" y="575.2" fill="#172b4d" font-size="20"><tspan x="678" dy="0">기존 결과 재표시</tspan><tspan x="678" dy="28">외부 업무 재실행 방지</tspan></text><path d="M1105,445 L1105,472" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="485" width="270" height="185" rx="14" fill="#fff5e6" stroke="#becbd8" stroke-width="1.5"/><text x="988" y="526" fill="#92520b" font-size="23"><tspan x="988" dy="0">결과 불명·중단</tspan></text><text x="988" y="575.2" fill="#172b4d" font-size="20"><tspan x="988" dy="0">외부 결과·권한 대조</tspan><tspan x="988" dy="28">안전한 단계만 재개</tspan></text><text x="40" y="735" fill="#9c3443" font-size="22"><tspan x="40" dy="0">결과 불명 = 미실행이 아님 · 외부 처리 여부를 확인하기 전 자동 재실행 금지</tspan></text></g></svg>