span></text><text x="749" y="919" font-size="20" fill="#526678" font-weight="400"><tspan x="749" dy="0">대상 볼륨 · 최근 성공 · 복원 결과 확인</tspan><tspan x="749" dy="28">정책이 있다는 사실만으로 성공 처리하지 않음</tspan></text></g></svg>