<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1440" height="890" fill="#f8fafc"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><text x="40" y="58" font-size="34" fill="#18344c" font-weight="700"><tspan x="40" dy="0">인프라 리스크를 줄이는 네 가지 후보</tspan></text><text x="40" y="100" font-size="22" fill="#526678" font-weight="400"><tspan x="40" dy="0">전부 차례로 구축하는 단계표가 아닙니다. 부족한 목표에 맞춰 선택합니다.</tspan></text><rect x="40" y="140" width="660" height="300" rx="15" fill="#eaf8f5" stroke="#abd7cd" stroke-width="2" /><text x="65" y="186" font-size="28" fill="#087f73" font-weight="700"><tspan x="65" dy="0">A. 기본 방어 보강</tspan></text><rect x="65" y="213" width="260" height="78" rx="15" fill="#fff" stroke="#abd7cd" stroke-width="2" /><text x="84" y="250" font-size="23" fill="#18344c" font-weight="700"><tspan x="84" dy="0">단일 서버 유지</tspan></text><rect x="370" y="213" width="300" height="78" rx="15" fill="#fff" stroke="#abd7cd" stroke-width="2" /><text x="389" y="250" font-size="23" fill="#18344c" font-weight="700"><tspan x="389" dy="0">외부 관측 + 복구 지점</tspan></text><path d="M 325 252 L 358 252" fill="none" stroke="#087f73" stroke-width="2.5" marker-end="url(#arrow)" /><text x="65" y="337" font-size="22" fill="#18344c" font-weight="400"><tspan x="65" dy="0">우선 추천: 인지 지연·복원 불가 위험 축소</tspan><tspan x="65" dy="30.799999999999997">운영 복잡성은 작지만, 고장 시 중단은 남음</tspan></text><rect x="740" y="140" width="660" height="300" rx="15" fill="#eef5ff" stroke="#a7c8e6" stroke-width="2" /><text x="765" y="186" font-size="28" fill="#1767a6" font-weight="700"><tspan x="765" dy="0">B. 병목 자원의 Scale up</tspan></text><rect x="765" y="213" width="260" height="78" rx="15" fill="#fff" stroke="#a7c8e6" stroke-width="2" /><text x="784" y="250" font-size="23" fill="#18344c" font-weight="700"><tspan x="784" dy="0">실제 병목 확인</tspan></text><rect x="1070" y="213" width="300" height="78" rx="15" fill="#fff" stroke="#a7c8e6" stroke-width="2" /><text x="1089" y="250" font-size="23" fill="#18344c" font-weight="700"><tspan x="1089" dy="0">CPU · RAM · 디스크 등</tspan></text><path d="M 1025 252 L 1058 252" fill="none" stroke="#1767a6" stroke-width="2.5" marker-end="url(#arrow)" /><text x="765" y="337" font-size="22" fill="#18344c" font-weight="400"><tspan x="765" dy="0">용량 부족일 때 필요한 자원만 보강</tspan><tspan x="765" dy="30.799999999999997">한 대의 고장 위험은 해결하지 못함</tspan></text><rect x="40" y="480" width="660" height="300" rx="15" fill="#fff6e7" stroke="#e6c69b" stroke-width="2" /><text x="65" y="526" font-size="28" fill="#9d671e" font-weight="700"><tspan x="65" dy="0">C. 역할·저장소 분리</tspan></text><rect x="65" y="553" width="260" height="78" rx="15" fill="#fff" stroke="#e6c69b" stroke-width="2" /><text x="84" y="590" font-size="23" fill="#18344c" font-weight="700"><tspan x="84" dy="0">앱은 한 대 유지</tspan></text><rect x="370" y="553" width="300" height="78" rx="15" fill="#fff" stroke="#e6c69b" stroke-width="2" /><text x="389" y="590" font-size="23" fill="#18344c" font-weight="700"><tspan x="389" dy="0">별도 DB · 파일 저장소</tspan></text><path d="M 325 592 L 358 592" fill="none" stroke="#9d671e" stroke-width="2.5" marker-end="url(#arrow)" /><text x="65" y="677" font-size="22" fill="#18344c" font-weight="400"><tspan x="65" dy="0">경합과 일부 고장 영향의 범위를 줄임</tspan><tspan x="65" dy="30.799999999999997">앱 단일 장애 지점·관리 항목 증가는 남음</tspan></text><rect x="740" y="480" width="660" height="300" rx="15" fill="#f1edfc" stroke="#c9b8e8" stroke-width="2" /><text x="765" y="526" font-size="28" fill="#7050a0" font-weight="700"><tspan x="765" dy="0">D. 다중 AZ 이중화·수평 확장</tspan></text><rect x="765" y="553" width="260" height="78" rx="15" fill="#fff" stroke="#c9b8e8" stroke-width="2" /><text x="784" y="590" font-size="23" fill="#18344c" font-weight="700"><tspan x="784" dy="0">LB + 여러 앱 인스턴스</tspan></text><rect x="1070" y="553" width="300" height="78" rx="15" fill="#fff" stroke="#c9b8e8" stroke-width="2" /><text x="1089" y="590" font-size="23" fill="#18344c" font-weight="700"><tspan x="1089" dy="0">공유 실행 기반 + 자료</tspan></text><path d="M 1025 592 L 1058 592" fill="none" stroke="#7050a0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="765" y="677" font-size="22" fill="#18344c" font-weight="400"><tspan x="765" dy="0">현재는 허브·파일·실행 등 사전 개선 필요</tspan><tspan x="765" dy="30.799999999999997">필수 하위 계층의 고가용성까지 확인</tspan></text><text x="40" y="838" font-size="24" fill="#18344c" font-weight="700"><tspan x="40" dy="0">추천: A부터 확인·보강 → 실측에 따라 B / C 선택 → 목표가 요구할 때 D 검토</tspan></text></g></svg>