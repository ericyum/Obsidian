<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.node{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.state{fill:#fff7ed;stroke:#f97316}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.label{fill:#f8fafc;stroke:#cbd5e1}.t{font-family:"Malgun Gothic",Arial,sans-serif;fill:#1f2937;text-anchor:middle}.s{font-family:"Malgun Gothic",Arial,sans-serif;fill:#c2410c;text-anchor:middle}.e{font-family:"Malgun Gothic",Arial,sans-serif;fill:#475569;text-anchor:middle}</style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <rect class="node" x="410" y="80" width="380" height="110" rx="14"/><text class="t" x="600" y="125" font-size="21">요청 대기·회의 시작 Node</text><rect class="state" x="480" y="145" width="240" height="42" rx="10"/><text class="s" x="600" y="172" font-size="16">State: none</text>
  <rect class="node" x="410" y="330" width="380" height="110" rx="14"/><text class="t" x="600" y="375" font-size="21">녹화 Node</text><rect class="state" x="480" y="395" width="240" height="42" rx="10"/><text class="s" x="600" y="422" font-size="16">State: recording</text>
  <rect class="node" x="100" y="590" width="380" height="110" rx="14"/><text class="t" x="290" y="635" font-size="21">일시정지 Node</text><rect class="state" x="170" y="655" width="240" height="42" rx="10"/><text class="s" x="290" y="682" font-size="16">State: pause</text>
  <rect class="node" x="720" y="590" width="380" height="110" rx="14"/><text class="t" x="910" y="635" font-size="21">종료 처리 Node</text><rect class="state" x="790" y="655" width="240" height="42" rx="10"/><text class="s" x="910" y="682" font-size="16">State: stop</text>
  <path class="edge" d="M600 190 V330"/><rect class="label" x="645" y="228" width="230" height="48" rx="10"/><text class="e" x="760" y="248" font-size="15"><tspan x="760">회의 시작 성공</tspan><tspan x="760" dy="19">none → recording</tspan></text>
  <path class="edge" d="M500 440 L290 590"/><rect class="label" x="250" y="485" width="245" height="48" rx="10"/><text class="e" x="372" y="505" font-size="15"><tspan x="372">일시정지 성공</tspan><tspan x="372" dy="19">recording → pause</tspan></text>
  <path class="edge" d="M100 630 H40 V385 H410"/><rect class="label" x="45" y="440" width="230" height="48" rx="10"/><text class="e" x="160" y="460" font-size="15"><tspan x="160">재개 성공</tspan><tspan x="160" dy="19">pause → recording</tspan></text>
  <path class="edge" d="M700 440 L910 590"/><rect class="label" x="705" y="485" width="245" height="48" rx="10"/><text class="e" x="827" y="505" font-size="15"><tspan x="827">종료 성공</tspan><tspan x="827" dy="19">recording → stop</tspan></text>
  <path class="edge" d="M480 645 H720"/><rect class="label" x="490" y="570" width="220" height="48" rx="10"/><text class="e" x="600" y="590" font-size="15"><tspan x="600">종료 성공</tspan><tspan x="600" dy="19">pause → stop</tspan></text>
  <path class="edge" d="M1100 645 H1160 V135 H790"/><rect class="label" x="920" y="225" width="220" height="48" rx="10"/><text class="e" x="1030" y="245" font-size="15"><tspan x="1030">종료 처리 완료</tspan><tspan x="1030" dy="19">stop → none</tspan></text>
</svg>