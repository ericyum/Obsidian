  <path class="edge" d="M700 200 L930 470"/><rect class="label" x="770" y="300" width="220" height="48" rx="10"/><text class="e" x="880" y="320" font-size="15"><tspan x="880">질문으로 판단</tspan><tspan x="880" dy="19">none → question</tspan></text>
