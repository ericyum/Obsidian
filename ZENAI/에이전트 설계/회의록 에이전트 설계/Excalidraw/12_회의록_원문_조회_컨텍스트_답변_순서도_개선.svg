Sans KR',sans-serif" font-size="19" fill="#2563eb"><tspan x="865" dy="0">오케스트레이터 담당</tspan></text><text x="1450" y="320.84" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="19" fill="#475569"><tspan x="1450" dy="0">Tool · 백엔드 담당</tspan></text><text x="860" y="56.12" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="860" dy="0">START</tspan></text><text x="860" y="143.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="860" dy="0">Agent 요청 대기</tspan></text><text x="860" y="233.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="860" dy="0">사용자 · 회의록 내용 질문</tspan></text><text x="865" y="383.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="865" dy="0">사용자 질문을 messages에 반영</tspan></text><text x="285" y="529.36" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="285" dy="0">LLM</tspan><tspan x="285" dy="21.76">회의록 원문 필요 여부와</tspan><tspan x="285" dy="21.76">Tool 2 호출 판단</tspan></text><text x="865" y="718.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="865" dy="0">허용된 회의록 ID가 있는가?</tspan></text><text x="715" y="865.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="715" dy="0">Tool 2 인터페이스 호출</tspan><tspan x="715" dy="21.76">허용된 ID의 원문 조회</tspan></text><text x="1055" y="870.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="1055" dy="0">회의록 선택 필요 결과</tspan><tspan x="1055" dy="21.76">정형화 컨텍스트</tspan></text><text x="1450" y="1052.74" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="1450" dy="0">요청 ID 허용 목록 포함 여부 검사</tspan><tspan x="1450" dy="21.76">회의록 원문 조회</tspan></text><text x="1450" y="1216.12" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="1450" dy="0">Tool 실행 결과</tspan></text><text x="1450" y="1355.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="1450" dy="0">실행 중 문서 데이터</tspan><tspan x="1450" dy="21.76">회의록 원문</tspan></text><text x="800" y="1500.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="800" dy="0">시스템 지시 + 원문 + messages</tspan><tspan x="800" dy="21.76">최종 Model Context 조립</tspan></text><text x="1060" y="1500.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="1060" dy="0">Tool 거부·실패 결과</tspan><tspan x="1060" dy="21.76">정형화 컨텍스트</tspan></text><text x="285" y="1659.36" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="285" dy="0">LLM</tspan><tspan x="285" dy="21.76">원문·선택 필요·실패 결과에 맞는</tspan><tspan x="285" dy="21.76">최종 답변 생성</tspan></text><text x="855" y="1805.24" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="855" dy="0">최종 답변만 messages에 추가</tspan><tspan x="855" dy="21.76">회의록 원문은 저장하지 않음</tspan></text><text x="855" y="1923.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="855" dy="0">Agent 업무 경계 Checkpoint</tspan></text><text x="855" y="2018.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="855" dy="0">사용자에게 최종 답변 반환</tspan></text><text x="855" y="2108.62" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="855" dy="0">Agent 요청 대기</tspan></text><text x="855" y="2196.12" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937"><tspan x="855" dy="0">END · 다음 입력까지 대기</tspan></text><text x="1445" y="806.2" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#1f2937"><tspan x="1445" dy="0">Tool 2는 인터페이스</tspan><tspan x="1445" dy="19.2">요청 ID가 authorized_meeting_id</tspan><tspan x="1445" dy="19.2">s에 포함될 때만 백엔드 조회 허용</tspan></text><text x="520" y="469" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="520" dy="0">에이전트 호출</tspan></text><text x="520" y="692" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="520" dy="0">Tool 2 필요</tspan></text><text x="793" y="803" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="793" dy="0">있음</tspan></text><text x="1055" y="784" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="1055" dy="0">없음</tspan></text><text x="1450" y="1293" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="1450" dy="0">성공</tspan></text><text x="1180" y="1296" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937"><tspan x="1180" dy="0">거부·실패</tspan></text><text x="82" y="1164" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#0f766e"><tspan x="82" dy="0">↻ 다음 질문</tspan></text></svg>