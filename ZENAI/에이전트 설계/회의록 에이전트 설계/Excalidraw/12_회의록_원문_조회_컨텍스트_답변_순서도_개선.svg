Tool 인터페이스 호출·허용 목록 검사·원문 조회</ns0:tspan></ns0:text><ns0:text x="600" y="1070" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">허용된 회의록 ID가 있는가?</ns0:tspan></ns0:text><ns0:text x="415" y="1185" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="415" dy="0">Tool 2 인터페이스 호출</ns0:tspan><ns0:tspan x="415" dy="21.76">허용된 ID의 원문 조회</ns0:tspan></ns0:text><ns0:text x="930" y="1995" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="930" dy="0">회의록 선택 필요 결과</ns0:tspan></ns0:text><ns0:text x="600" y="917" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">Tool 2 필요</ns0:tspan></ns0:text><ns0:text x="455" y="1130" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" opacity="1"><ns0:tspan x="455" dy="0">있음</ns0:tspan></ns0:text><ns0:text x="805" y="1130" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" opacity="1"><ns0:tspan x="805" dy="0">없음</ns0:tspan></ns0:text><ns0:text x="600" y="1465" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">요청 ID 허용 목록 포함 여부 검사</ns0:tspan><ns0:tspan x="600" dy="21.76">회의록 원문 조회</ns0:tspan></ns0:text><ns0:text x="600" y="1650" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">Tool 실행 결과</ns0:tspan></ns0:text><ns0:text x="210" y="1452" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#5b21b6" opacity="1"><ns0:tspan x="210" dy="0">Tool 2는 실행 인터페이스</ns0:tspan><ns0:tspan x="210" dy="17.92">허용된 ID만 조회 가능</ns0:tspan></ns0:text><ns0:text x="86" y="1916" text-anchor="start" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#2563eb" opacity="1"><ns0:tspan x="86" dy="0">Tool 2 담당 · 실행 결과 유형별 처리</ns0:tspan></ns0:text><ns0:text x="280" y="1975" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="280" dy="0">실행 중 문서 데이터</ns0:tspan><ns0:tspan x="280" dy="21.76">회의록 원문</ns0:tspan></ns0:text><ns0:text x="600" y="2000" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">Tool 거부·실패 결과</ns0:tspan></ns0:text><ns0:text x="360" y="1738" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" opacity="1"><ns0:tspan x="360" dy="0">성공</ns0:tspan></ns0:text><ns0:text x="720" y="1738" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#1f2937" opacity="1"><ns0:tspan x="720" dy="0">거부·실패</ns0:tspan></ns0:text><ns0:text x="136" y="2446" text-anchor="start" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#dc2626" opacity="1"><ns0:tspan x="136" dy="0">Tool 2 출력 · 정형화된 실행 결과 반환</ns0:tspan></ns0:text><ns0:text x="600" y="2500" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">원문·선택 필요·실패 결과에 맞는</ns0:tspan><ns0:tspan x="600" dy="21.76">정형화된 Tool 2 결과 반환</ns0:tspan></ns0:text><ns0:text x="136" y="2676" text-anchor="start" font-family="Arial,'Noto Sans KR',sans-serif" font-size="16" fill="#2563eb" opacity="1"><ns0:tspan x="136" dy="0">커스텀 Harness · Tool 결과 반영</ns0:tspan></ns0:text><ns0:text x="600" y="2730" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="17" fill="#1f2937" opacity="1"><ns0:tspan x="600" dy="0">Tool 2의 결과값은</ns0:tspan><ns0:tspan x="600" dy="21.76">이후 LLM에 넣을 Context에 들어감</ns0:tspan><ns0:tspan x="600" dy="21.76">회의록 원문은 저장하지 않음</ns0:tspan></ns0:text><ns0:rect x="18" y="18" width="340" height="34" rx="8" stroke="#475569" fill="#f8fafc" stroke-width="2" opacity="1" /><ns0:text x="188" y="39" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="14" fill="#475569" opacity="1"><ns0:tspan x="188" dy="0">그림 유형 · 질의 상세 순서도</ns0:tspan></ns0:text><ns0:rect x="20" y="15" width="1160" height="815" rx="8" stroke="#f97316" fill="none" stroke-width="2" opacity="1" /><ns0:rect x="35" y="905" width="1130" height="1705" rx="8" stroke="#f97316" fill="none" stroke-width="2" opacity="1" /><ns0:rect x="700" y="896" width="460" height="24" rx="8" stroke="#f97316" fill="#fff7ed" stroke-width="2" opacity="1" /><ns0:text x="930" y="915" text-anchor="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#f97316" opacity="1"><ns0:tspan x="930" dy="0">State 변경 · none → question</ns0:tspan></ns0:text><ns0:text x="40" y="1675" text-anchor="start" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" fill="#0f766e" opacity="1"><ns0:tspan x="40" dy="0">Tool 2 반환값</ns0:tspan><ns0:tspan x="40" dy="18.75">Agent LLM 재판단</ns0:tspan></ns0:text><ns0:rect x="800" y="55" width="340" height="30" rx="8" stroke="#f97316" fill="#fff7ed" stroke-width="2" opacity="1" /><ns0:text x="806" y="74" text-anchor="start" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#f97316" opacity="1"><ns0:tspan x="806" dy="0">상위 State 범위 · none</ns0:tspan></ns0:text><ns0:polyline points="350,2745 25,2745 25,685 390,685" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#m0)" /></ns0:svg>