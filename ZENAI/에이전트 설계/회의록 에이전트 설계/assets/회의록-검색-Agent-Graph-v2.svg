<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #222; }
      .node { stroke-width: 2; }
      .agent { fill: #ffe3e3; stroke: #ff3636; }
      .gate { fill: #fff3c9; stroke: #f29d2e; }
      .terminal { fill: #e8f1ff; stroke: #1769ff; }
      .note { fill: #fffaf2; stroke: #ff8b2b; stroke-width: 2; stroke-dasharray: 8 6; }
      .edge { fill: none; stroke: #777; stroke-width: 2.2; marker-end: url(#arrow-gray); }
      .branch { fill: none; stroke: #ef3028; stroke-width: 2.5; marker-end: url(#arrow-red); }
      .retry { fill: none; stroke: #ff8b2b; stroke-width: 2; stroke-dasharray: 7 6; }
      .title { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .body { font-size: 17px; text-anchor: middle; }
      .small { font-size: 15px; text-anchor: middle; }
      .label { font-size: 15px; text-anchor: middle; }
      .code { font-size: 13px; text-anchor: middle; fill: #555; }
    </style>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#777"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,5 L0,10 Z" fill="#ef3028"/>
    </marker>
  </defs>

  <!-- 중앙 정상 흐름 -->
  <rect class="node terminal" x="650" y="24" width="160" height="56" rx="28"/>
  <text class="title" x="730" y="59">START</text>

  <rect class="node agent" x="550" y="130" width="360" height="110"/>
  <text class="title" x="730" y="165">1. 회의록 검색 Node</text>
  <text class="body" x="730" y="194">LLM 검색 조건 구성</text>
  <text class="body" x="730" y="220">Tool 2 권한 필터·후보 검색</text>

  <rect class="node gate" x="550" y="390" width="360" height="120"/>
  <text class="title" x="730" y="425">2. 회의록 선택 Gate</text>
  <text class="body" x="730" y="454">1개 자동 선택</text>
  <text class="body" x="730" y="480">2개 이상 Human in the Loop</text>
  <text class="body" x="730" y="502">Tool 3 ID 검증</text>

  <rect class="node agent" x="550" y="650" width="360" height="120"/>
  <text class="title" x="730" y="687">3. 회의록 질의 Node</text>
  <text class="body" x="730" y="718">Tool 4 원문 조회</text>
  <text class="body" x="730" y="746">컨텍스트 조립 + LLM 답변</text>

  <!-- 오른쪽 종료 분기 -->
  <rect class="node terminal" x="1080" y="150" width="220" height="70" rx="35"/>
  <text class="title" x="1190" y="180">END</text>
  <text class="body" x="1190" y="205">후보 없음</text>

  <rect class="node terminal" x="1080" y="415" width="220" height="70" rx="35"/>
  <text class="title" x="1190" y="445">END</text>
  <text class="body" x="1190" y="470">선택 취소</text>

  <rect class="node terminal" x="1060" y="665" width="300" height="90" rx="45"/>
  <text class="title" x="1210" y="695">END</text>
  <text class="body" x="1210" y="722">이번 Graph 실행 완료</text>
  <text class="small" x="1210" y="746">Agent는 none에서 입력 대기</text>

  <!-- 왼쪽 재시도 주석 -->
  <rect class="note" x="50" y="145" width="320" height="80"/>
  <text class="body" x="210" y="177">○ 검색 실패 후 재시도</text>
  <text class="code" x="210" y="204">RETRYABLE_FAILED</text>

  <rect class="note" x="50" y="670" width="320" height="80"/>
  <text class="body" x="210" y="702">○ 질의 실패 후 재시도</text>
  <text class="code" x="210" y="729">RETRYABLE_FAILED</text>

  <!-- Edge: 모든 접속부와 굴절점은 직각 -->
  <path class="edge" d="M730 80 V130"/>
  <path class="edge" d="M730 240 V390"/>
  <path class="edge" d="M730 510 V650"/>

  <path class="branch" d="M910 185 H1080"/>
  <path class="branch" d="M910 450 H1080"/>
  <path class="edge" d="M910 710 H1060"/>

  <!-- 후보가 없지만 기존 활성 ID를 유지하여 질의로 이동 -->
  <path class="branch" d="M550 185 H460 V610 H620 V650"/>

  <!-- 회의록 추가·대체: 아래와 오른쪽 여백을 사용하는 명시적 역방향 Edge -->
  <path class="branch" d="M840 770 V900 H1450 V300 H840 V240"/>

  <!-- 재시도는 자기 루프가 아니라 해당 Node의 옆 주석으로 표시 -->
  <path class="retry" d="M370 185 H550"/>
  <path class="retry" d="M370 710 H550"/>

  <!-- Edge 라벨 -->
  <rect x="617" y="293" width="226" height="47" fill="white"/>
  <text class="label" x="730" y="313">후보 있음</text>
  <text class="code" x="730" y="334">CANDIDATES_FOUND</text>

  <rect x="626" y="552" width="208" height="47" fill="white"/>
  <text class="label" x="730" y="572">ID 확정</text>
  <text class="code" x="730" y="593">IDS_CONFIRMED</text>

  <rect x="930" y="156" width="130" height="58" fill="white"/>
  <text class="label" x="995" y="177">후보 없음·</text>
  <text class="label" x="995" y="197">활성 ID 없음</text>
  <text class="code" x="995" y="215">NO_CANDIDATES</text>

  <rect x="940" y="421" width="112" height="53" fill="white"/>
  <text class="label" x="996" y="442">선택 취소</text>
  <text class="code" x="996" y="466">CANCELLED</text>

  <rect x="927" y="679" width="125" height="62" fill="white"/>
  <text class="label" x="989" y="700">질문 1회</text>
  <text class="label" x="989" y="720">처리 완료</text>
  <text class="code" x="989" y="740">QUESTION_HANDLED</text>

  <rect x="376" y="365" width="166" height="62" fill="white"/>
  <text class="label" x="459" y="386">후보 없음·</text>
  <text class="label" x="459" y="406">기존 ID 유지</text>
  <text class="code" x="459" y="426">NO_CANDIDATES</text>

  <rect x="1147" y="857" width="250" height="50" fill="white"/>
  <text class="label" x="1272" y="878">회의록 추가·대체</text>
  <text class="code" x="1272" y="899">SEARCH_MORE · REPLACE_IDS</text>
</svg>
