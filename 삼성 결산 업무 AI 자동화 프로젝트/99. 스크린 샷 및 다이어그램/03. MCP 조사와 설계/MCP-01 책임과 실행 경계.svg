<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="100%" height="100%" fill="#f8fafc"/>
<text x="60" y="71" font-family="Malgun Gothic, sans-serif" font-size="36" fill="#17304b" font-weight="700">MCP를 설계하려면 하네스와 업무 백엔드의 경계를 먼저 나눈다</text>
<text x="60" y="113" font-family="Malgun Gothic, sans-serif" font-size="21" fill="#52627a" font-weight="400">목표 책임 구분 · 플랫폼과 지원 기능은 협의 전</text>
<rect x="60" y="180" width="440" height="365" rx="15" fill="#eaf2ff" stroke="#b8c8da"/>
<text x="84" y="227" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#17304b" font-weight="700">Joule / Host</text>
<text x="84" y="274" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">문맥과 도구 선택</text>
<text x="84" y="308" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">모델 → 도구 → 모델 루프</text>
<text x="84" y="342" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">대화·확인·응답·시간 예산</text>
<text x="84" y="376" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400"></text>
<text x="84" y="410" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">압축·자동 재개는 지원 확인</text>
<rect x="580" y="180" width="440" height="365" rx="15" fill="#e8f6ef" stroke="#b8c8da"/>
<text x="604" y="227" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#17304b" font-weight="700">우리 MCP 계약</text>
<text x="604" y="274" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">업무 목적별 Tool</text>
<text x="604" y="308" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">입력·출력·오류·크기 상한</text>
<text x="604" y="342" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">짧은 응답·ID·관측</text>
<text x="604" y="376" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400"></text>
<text x="604" y="410" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">RAP URL은 adapter로 연결</text>
<rect x="1100" y="180" width="440" height="365" rx="15" fill="#fff2df" stroke="#b8c8da"/>
<text x="1124" y="227" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#17304b" font-weight="700">RAP / ABAP / 연계</text>
<text x="1124" y="274" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">권한·업무 규칙·회계 계산</text>
<text x="1124" y="308" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">영속 접수·Job·결과 검증</text>
<text x="1124" y="342" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">Task·HIST 반영</text>
<text x="1124" y="376" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400"></text>
<text x="1124" y="410" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">정답과 완료 기준은 공동 합의</text>
<line x1="505" y1="340" x2="575" y2="340" stroke="#456783" stroke-width="3"/><polygon points="575,340 561.1840850899567,345.84127513462977 561.1840850899567,334.15872486537023" fill="#456783"/>
<line x1="1025" y1="340" x2="1095" y2="340" stroke="#456783" stroke-width="3"/><polygon points="1095,340 1081.1840850899566,345.84127513462977 1081.1840850899566,334.15872486537023" fill="#456783"/>
<rect x="60" y="625" width="1480" height="210" rx="15" fill="#eef0f5" stroke="#b8c8da"/>
<text x="84" y="672" font-family="Malgun Gothic, sans-serif" font-size="27" fill="#17304b" font-weight="700">핵심 경계</text>
<text x="84" y="719" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">MCP 서버가 호스트의 내부 기억·interrupt·resume를 자동으로 만들어주지는 않는다.</text>
<text x="84" y="753" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#17304b" font-weight="400">업무 상태는 대화와 분리해 보존하고, 모델은 필요한 범위와 근거를 짧게 다시 읽는다.</text>
<text x="60" y="916" font-family="Malgun Gothic, sans-serif" font-size="21" fill="#52627a" font-weight="400">조사 기반 개념도 · 구현 완료 또는 SAP 공식 아키텍처를 뜻하지 않음</text>
</svg>