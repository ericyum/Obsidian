<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="60" y="32" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#17304b">짧은 호출로 긴 결산 업무를 이어가는 계약</text>
<text x="60" y="93" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#52627a">일반 Tool의 응답 완료와 SAP 업무 완료를 구분 · 현재 배포 경로가 아닌 설계 제안</text>
