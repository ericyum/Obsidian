<text x="83" y="990" dominant-baseline="text-before-edge" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#17304b">RequestID·대상·모드 검증 → Task/HIST 반영. 자동 polling·알림·resume는 지원·담당 계약 확인 후 추가.</text>
